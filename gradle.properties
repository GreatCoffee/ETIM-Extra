# Gradle Properties
org.gradle.jvmargs = -Xmx3G

# Source Options
use_modern_java_syntax = false
use_jetbrains_annotations = false

# Compilation Options
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = false
show_testing_output = false

# Mod Information
mod_version = 0.1.0
root_package = io.github.etim
mod_id = etimextra
mod_name = ETIM-Extra

# Mod Metadata (Optional)
# gradle.properties is read by Java as ISO-8859-1; non-ASCII text (e.g. Chinese)
# MUST be stored as \uXXXX escapes. Player-facing names live in the lang files.
mod_description = ETIM-Extra -- add-on for Easy Times In Minecraft: mithril and adamantium shields.
mod_url = https://github.com/GreatCoffee/ETIM-Extra
mod_update_json =
mod_authors = ETIM Team
mod_credits = Avernite (MITE), CleanroomMC (ForgeDevEnv), GTNewHorizons (RetroFuturaGradle)
mod_logo_path =

# Mapping Properties
mapping_channel = stable
mapping_version = 39
use_dependency_at_files = true

# Run Configurations
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.

# Modify Minecraft Sources
change_minecraft_sources = false

# Tags
use_tags = true
tag_class_name = ${root_package}.${mod_id}.Tags

# Access Transformers
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
# The toolchain prerequisite: the dev boot must carry the Mixin library (the
# main mod is a mixin mod). No mixin class of this mod exists yet, so
# mixin_configs stays empty; `modUtils.enableMixins` still provisions the
# library + MixinBooter on the dev classpath. run/mods must NOT hold a
# mixinbooter jar (classpath + mods = duplicate coremod).
use_mixins = true
mixin_booter_version = 11.13
generate_mixins_json = false
mixin_configs =
mixin_connector_class =
mixin_refmap = mixins.${mod_id}.refmap.json
mixin_package = ${root_package}.${mod_id}.mixins

# Coremods
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
use_asset_mover = false
asset_mover_version = 2.5
